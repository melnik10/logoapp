# Демо-стенд LogoApp на Render: New → Blueprint → этот репозиторий
services:
  - type: web
    name: logoapp
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: logoapp-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SHOW_DEMO_LOGINS
        value: "1"

databases:
  - name: logoapp-db
    plan: free
    region: frankfurt
    databaseName: logoapp
    user: logoapp
